<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>{{TITLE}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== promo-ad-forge / web-pop 範本（由 scripts/build_ad.py 產生；改內容請改 content.json 再重建） =====
         風格：粉彩色塊換場、逐字跳出、貼紙標籤、icon 卡打叉、官網截圖拆件、數字滾動、彩紙爆、放射光 CTA */
      {{FONTFACE}}
      :root { {{CSSVARS}} }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; font-family: "Brand", "NotoTC", sans-serif; color: var(--ink); }
      .clip { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; overflow: hidden; }
      .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; padding: var(--safe); }
      .row { display: flex; flex-direction: row; align-items: center; justify-content: center; }
      .col { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .ch { display: inline-block; white-space: pre; }
      .hd { font-weight: 900; line-height: 1.3; letter-spacing: 0.02em; }
      .md { font-weight: 700; line-height: 1.4; }
      .hi { color: var(--hi); }
      .nowrap { white-space: nowrap; }

      /* 背景層 */
      #bgc { background: var(--bg); }
      #dots { opacity: 0.55; background-image: radial-gradient(rgba(255,255,255,0.55) 2.6px, transparent 3.2px); background-size: 46px 46px; }

      /* 元件 */
      .pill { display: inline-block; padding: 0.32em 1.05em; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 800; white-space: nowrap; }
      .pill.light { background: #fff; color: var(--hi-strong); box-shadow: 0 8px 22px rgba(0,0,0,0.10); }
      .card { background: #fff; border-radius: 30px; box-shadow: 0 18px 44px rgba(40, 20, 30, 0.14); }
      .sticker { display: inline-block; padding: 0.28em 0.7em; border-radius: 16px; font-weight: 900; white-space: nowrap;
        border: 5px solid #fff; box-shadow: 0 10px 0 rgba(0,0,0,0.10), 0 16px 30px rgba(0,0,0,0.16); }
      .badge { border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden;
        box-shadow: 0 16px 40px rgba(0,0,0,0.16); }
      .badge img { width: 74%; height: 74%; object-fit: contain; }
      .badge .init { font-weight: 900; color: var(--primary-ink); }
      .ic { display: flex; align-items: center; justify-content: center; }
      .ic svg { width: 100%; height: 100%; }
      .plate { border-radius: 50%; background: #fff; padding: 18px; box-shadow: 0 22px 50px rgba(0,0,0,0.18); }
      .plate .ring { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 4px dashed var(--soft-line); display: flex; align-items: center; justify-content: center; }
      .plate img { width: 100%; height: 100%; object-fit: cover; }
      .photo { background: #fff; padding: 12px; border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,0.2); }
      .photo img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
      .sun { position: absolute; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,0.16) 0deg 9deg, rgba(255,255,255,0) 9deg 18deg); }
      .cursor { position: absolute; width: 64px; height: 64px; z-index: 20; }
      .ripple { position: absolute; border-radius: 50%; border: 6px solid var(--primary); opacity: 0; z-index: 19; }
      .browser { position: relative; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 70px rgba(30,10,30,0.22); }
      .browser .bar { height: 54px; background: #f3f0f2; display: flex; align-items: center; gap: 12px; padding: 0 20px; }
      .browser .bar i { display: block; width: 15px; height: 15px; border-radius: 50%; }
      .browser .url { margin-left: 14px; flex: 1; height: 32px; border-radius: 16px; background: #fff; font-size: 19px; color: #777; display: flex; align-items: center; padding: 0 18px; text-align: left; white-space: nowrap; overflow: hidden; }
      .browser .view { position: relative; overflow: hidden; background: #fff; }
      .browser .view img { position: absolute; left: 0; top: 0; width: 100%; }
      .phone { position: relative; background: #1d1a1f; border-radius: 64px; padding: 20px; box-shadow: 0 30px 70px rgba(30,10,30,0.28); }
      .phone .view { position: relative; overflow: hidden; border-radius: 46px; background: #fff; }
      .phone .view img { position: absolute; left: 0; top: 0; width: 100%; }
      .toast { position: absolute; display: flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px; background: #fff;
        font-weight: 800; box-shadow: 0 12px 30px rgba(0,0,0,0.18); white-space: nowrap; z-index: 18; color: var(--ink); }
      .toast .ok { width: 34px; height: 34px; border-radius: 50%; background: #2fb36d; color: #fff; display: flex; align-items: center; justify-content: center; }
      .xmark { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .pcard { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
      .feat { display: flex; align-items: center; text-align: left; }
      .feat .fi { border-radius: 50%; background: #fff; box-shadow: 0 14px 34px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; flex: none; }
      .feat .num { font-weight: 900; color: var(--hi); }
      .feat .ul { height: 7px; border-radius: 4px; background: var(--hi); transform-origin: left center; }
      .stat .bar { position: relative; height: 18px; border-radius: 9px; background: rgba(0,0,0,0.08); overflow: hidden; }
      .stat .bar b { position: absolute; left: 0; top: 0; height: 100%; width: 100%; border-radius: 9px; background: var(--primary); transform-origin: left center; display: block; }
      .track { position: absolute; border: 0 dashed var(--soft-line); }
      .runner { position: absolute; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 26px rgba(0,0,0,0.2); z-index: 5; }
      .stop { position: absolute; border-radius: 50%; background: #fff; border: 6px solid var(--soft-line); }
      .scard { position: absolute; padding: 18px 26px; display: flex; align-items: center; gap: 14px; text-align: left; }
      .cf { position: absolute; left: 0; top: 0; opacity: 0; }
      #flash { background: #fff; opacity: 0; }
      .float-dot { position: absolute; border-radius: 50%; }
      #iris { position: absolute; border-radius: 50%; opacity: 0; }
      .stripe { position: absolute; top: -20%; height: 140%; opacity: 1; }
      #disclaimer { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; opacity: 0.75; }

      /* 背景特效層（老店紅金 heritage 風格用；每幕由 BEAT.scenes[].fx 開關） */
      #rays, #vig, #paper, #dust { opacity: 0; }
      #rays { position: absolute; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 214, 150, 0.13) 0deg 6deg, rgba(0, 0, 0, 0) 6deg 12deg); }
      #vig { background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 45%, rgba(40, 0, 0, 0.42) 100%); }
      #paper { background:
          linear-gradient(var(--primary) 0 0) top / 100% 22px no-repeat,
          linear-gradient(var(--gold) 0 0) 0 22px / 100% 5px no-repeat,
          linear-gradient(var(--gold) 0 0) 0 calc(100% - 22px) / 100% 5px no-repeat,
          linear-gradient(var(--primary) 0 0) bottom / 100% 22px no-repeat,
          repeating-linear-gradient(-45deg, rgba(160, 40, 40, 0.07) 0 38px, rgba(0, 0, 0, 0) 38px 76px); }
      #dust { background-image: radial-gradient(rgba(240, 200, 120, 0.55) 1.6px, transparent 2.6px), radial-gradient(rgba(240, 200, 120, 0.3) 1.2px, transparent 2px);
        background-size: 140px 140px, 90px 90px; background-position: 0 0, 45px 60px; }

      /* 商品／電商元件（product_card、product_grid、giftbox、member_signup、store_info、emblem） */
      .ghost { position: absolute; font-weight: 900; line-height: 1; color: transparent; -webkit-text-stroke: 3px var(--ghost); }
      .stamp { position: absolute; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center;
        text-align: center; font-weight: 900; line-height: 1.2; border: 7px double #fff; box-shadow: 0 10px 24px rgba(0,0,0,0.28); z-index: 6; }
      .tagp { display: inline-block; padding: 0.22em 0.8em; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 800; white-space: nowrap; border: 3px solid rgba(255,255,255,0.85); }
      .hplate { background: #fff8ea; border: 6px solid var(--gold); }
      .hplate .ring { border-color: rgba(0,0,0,0); }
      .hplate img { object-fit: contain; }
      .gcell { position: absolute; background: #fffaf0; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.22); display: flex; flex-direction: column; align-items: center; overflow: hidden; color: #3b1f14; }
      .gcell .gi { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .gcell .gi img { width: 100%; height: 100%; object-fit: contain; }
      .gframe { position: absolute; border: 3px solid var(--gold); border-radius: 16px; opacity: 0.75; }
      .glow { position: absolute; border-radius: 50%; border: 4px solid var(--gold); background: radial-gradient(circle, rgba(255, 220, 150, 0.35), rgba(255, 220, 150, 0) 70%); }
      .icard { background: #fffaf0; border-radius: 24px; box-shadow: 0 16px 38px rgba(0,0,0,0.25); color: #3b1f14; text-align: left; }
      .pform { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fff; color: #333; text-align: left; }
      .pform .fld { position: absolute; border: 2px solid #ddd; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; padding: 0 18px; }
      .pform .chk { position: absolute; display: flex; align-items: center; gap: 12px; }
      .pform .chk b { width: 30px; height: 30px; border: 2px solid #bbb; border-radius: 7px; position: relative; flex: none; display: block; }
      .pform .chk i { position: absolute; left: -2px; top: -2px; width: 30px; height: 30px; border-radius: 7px; background: #2fb36d; color: #fff;
        display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 900; font-size: 22px; }
      .pform .pbtn { position: absolute; border-radius: 999px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; }
      .pok { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #333; opacity: 0; }
      .bcard { display: flex; align-items: center; gap: 22px; background: #fffaf0; border-radius: 20px; box-shadow: 0 10px 26px rgba(0,0,0,0.2); color: #3b1f14; text-align: left; }
      .bcard .bi { border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
      .soc { border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
      .inf { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
      {{EXTRACSS}}
    </style>
  </head>
  <body>
    <div id="root" class="{{ROOTCLASS}}" data-composition-id="main" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
      <div id="bg" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="bgc" class="fill"></div>
        <div id="dots" class="fill"></div>
        <div id="rays" data-layout-ignore aria-hidden="true"></div>
        <div id="vig" class="fill" data-layout-ignore aria-hidden="true"></div>
        <div id="paper" class="fill" data-layout-ignore aria-hidden="true"></div>
        <div id="dust" class="fill" data-layout-ignore aria-hidden="true"></div>
      </div>
{{SCENES}}
      <div id="trans" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="3">
        <div id="iris" data-layout-ignore aria-hidden="true"></div>
        <div class="stripe" id="st1" data-layout-ignore aria-hidden="true"></div>
        <div class="stripe" id="st2" data-layout-ignore aria-hidden="true"></div>
        <div class="stripe" id="st3" data-layout-ignore aria-hidden="true"></div>
      </div>
      <div id="fx" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="4">
        <div id="confetti" class="fill" data-layout-ignore aria-hidden="true"></div>
        <div id="flash" class="fill" data-layout-ignore aria-hidden="true"></div>
        {{CHROME}}
      </div>
      <audio id="bgm" src="assets/bgm.wav" data-start="0" data-duration="{{DUR}}" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // ===== 節拍與幕表（build_ad.py 由 beats.json 產生；每幕起點＝小節頭） =====
      const BEAT = {{BEAT}};
      const B = BEAT.b, BAR = BEAT.bar, W = {{W}}, H = {{H}}, V = H > W;
      const PAL = BEAT.confetti;
      let seed = BEAT.seed;
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
      const Q = (id, sel) => document.querySelector("#" + id + " " + sel);
      const QA = (id, sel) => [...document.querySelectorAll("#" + id + " " + sel)];

      // ---------- 動態工具（全部同步建立、可 seek） ----------
      function pop(el, t, o = {}) {
        if (!el) return;
        tl.fromTo(el, { scale: o.s0 ?? 0, opacity: 0, rotation: o.r0 ?? 0, x: o.x0 ?? 0, y: o.y0 ?? 0 },
          { scale: 1, opacity: 1, rotation: o.r ?? 0, x: 0, y: 0, duration: o.d ?? 0.5, ease: o.ease ?? "back.out(2.2)" }, t);
      }
      function rise(el, t, o = {}) {
        if (!el) return;
        tl.fromTo(el, { y: o.y0 ?? 70, opacity: 0 }, { y: 0, opacity: 1, duration: o.d ?? 0.45, ease: o.ease ?? "power3.out" }, t);
      }
      function typeIn(el, t, step) {
        if (!el) return 0;
        const chs = [...el.querySelectorAll(".ch")];
        chs.forEach((c, i) => tl.fromTo(c, { opacity: 0, y: 34, scale: 0.4 },
          { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(3)" }, t + i * step));
        return chs.length * step;
      }
      let CUR_END = 1e9;  // 目前幕的結束時間；打字一律在結束前 0.4 秒完成
      const stepFor = (el, span, max = B / 2) => Math.min(max, span / Math.max(1, (el ? el.querySelectorAll(".ch").length : 1)));
      function typeFit(el, t, span, max = B / 2) {
        if (!el) return 0;
        const n = Math.max(1, el.querySelectorAll(".ch").length);
        const room = Math.max(0.2, CUR_END - 0.4 - 0.3 - t);
        return typeIn(el, t, Math.min(max, span / n, room / n));
      }
      function shake(el, t, amp = 12) {
        if (!el) return;
        tl.fromTo(el, { x: 0 }, { x: amp, duration: 0.04, repeat: 5, yoyo: true, ease: "none", immediateRender: false }, t);
        tl.set(el, { x: 0 }, t + 0.25);
      }
      function breathe(el, t0, t1, amt = 0.045) {
        if (!el) return;
        for (let t = t0; t < t1 - B; t += 2 * B)
          tl.fromTo(el, { scale: 1 + amt }, { scale: 1, duration: B * 1.6, ease: "power2.out", immediateRender: false }, t);
      }
      function bob(el, t0, t1, amp = 14) {
        if (!el || t1 - t0 < 0.6) return;
        const n = Math.max(1, Math.floor((t1 - t0) / (2 * B)));
        tl.fromTo(el, { y: 0 }, { y: -amp, duration: B, ease: "sine.inOut", yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);
      }
      function flash(t, peak = 0.5) {
        tl.fromTo("#flash", { opacity: peak }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
      }
      const confBox = document.getElementById("confetti");
      function burst(t, cx, cy, n = 26, spread = 1) {
        for (let i = 0; i < n; i++) {
          const c = document.createElement("div");
          c.className = "cf";
          const w = 12 + rnd() * 16, h = rnd() < 0.5 ? w : w * 0.45;
          c.style.width = w + "px"; c.style.height = h + "px";
          c.style.background = PAL[i % PAL.length];
          c.style.borderRadius = rnd() < 0.35 ? "50%" : "3px";
          confBox.appendChild(c);
          const a = rnd() * Math.PI * 2, dist = (180 + rnd() * 380) * spread;
          const dx = Math.cos(a) * dist, dy = Math.sin(a) * dist * 0.8 - 120 * spread;
          tl.fromTo(c, { x: cx, y: cy, opacity: 1, scale: 0.2, rotation: 0 },
            { x: cx + dx, y: cy + dy, scale: 1, rotation: rnd() * 360, duration: 0.55, ease: "expo.out", immediateRender: false }, t);
          tl.to(c, { y: cy + dy + 260 + rnd() * 240, rotation: "+=" + (180 + rnd() * 360), opacity: 0, duration: 1.0 + rnd() * 0.5, ease: "power1.in" }, t + 0.55);
        }
      }
      function rain(t, n = 40) {
        for (let i = 0; i < n; i++) {
          const c = document.createElement("div");
          c.className = "cf";
          const w = 12 + rnd() * 14;
          c.style.width = w + "px"; c.style.height = w * 0.5 + "px";
          c.style.background = PAL[i % PAL.length];
          confBox.appendChild(c);
          const x = rnd() * W, d = 1.6 + rnd() * 1.4, t1 = t + rnd() * 0.8;
          tl.fromTo(c, { x, y: -60, opacity: 1, rotation: rnd() * 180 },
            { x: x + (rnd() - 0.5) * 220, y: H * (0.55 + rnd() * 0.5), rotation: "+=" + (360 + rnd() * 360), opacity: 0, duration: d, ease: "power1.in", immediateRender: false }, t1);
        }
      }
      function cursorClick(id, t0, t1, from, to) {
        const cur = Q(id, ".cursor"), rip = Q(id, ".ripple");
        if (!cur) return;
        tl.fromTo(cur, { x: from[0], y: from[1], opacity: 0 }, { x: to[0], y: to[1], opacity: 1, duration: t1 - t0, ease: "power3.inOut" }, t0);
        tl.fromTo(cur, { scale: 1 }, { scale: 0.78, duration: 0.09, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, t1 + 0.02);
        if (rip) tl.fromTo(rip, { scale: 0.2, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, t1 + 0.05);
      }
      function setBg(t, color) { tl.set("#bgc", { backgroundColor: color }, t); }

      // ---------- 轉場 ----------
      const R = Math.hypot(W, H);
      gsap.set("#iris", { width: 2 * R, height: 2 * R });
      ["#st1", "#st2", "#st3"].forEach(s => gsap.set(s, { width: W * 0.75, skewX: -16, x: W * 1.4 }));
      function transition(kind, t, color, colors) {
        if (kind === "iris") {
          const ox = (rnd() < 0.5 ? 0.25 : 0.75) * W, oy = (rnd() < 0.5 ? 0.3 : 0.7) * H;
          tl.set("#iris", { left: ox - R, top: oy - R, backgroundColor: color }, t - 0.45);
          tl.fromTo("#iris", { scale: 0, opacity: 1 }, { scale: 1, duration: 0.45, ease: "power2.in", immediateRender: false }, t - 0.45);
          tl.set("#iris", { opacity: 0 }, t + 0.02);
        } else if (kind === "stripes") {
          ["#st1", "#st2", "#st3"].forEach((s, i) => {
            const c = i === 2 ? color : colors[i];
            tl.set(s, { backgroundColor: c, left: 0 }, t - 0.5);
            tl.fromTo(s, { x: W * 1.4 }, { x: -W * 0.05 + i * W * 0.2 - W * 0.1, duration: 0.38, ease: "power3.in", immediateRender: false }, t - 0.5 + i * 0.05);
            tl.to(s, { x: -W * 1.5, duration: 0.42, ease: "power3.out" }, t + 0.04 + i * 0.03);
          });
          // 第三條要整面蓋住：加寬
          tl.set("#st3", { width: W * 1.6 }, t - 0.5);
          tl.set("#st3", { width: W * 0.75 }, t + 0.6);
        }
      }

      // ---------- 15 種幕型（＋下方 6 種商品／電商幕型） ----------
      const S = {};
      S.logo_intro = (id, t0, d) => {
        const fill = Q(id, ".fillc");
        pop(Q(id, ".d1"), t0, { y0: -H * 0.45, s0: 1, d: B * 1.5, ease: "bounce.out" });
        pop(Q(id, ".d2"), t0 + B, { d: 0.35 });
        pop(Q(id, ".d3"), t0 + B * 1.5, { d: 0.35 });
        tl.fromTo(fill, { scale: 0 }, { scale: 1, duration: B * 1.4, ease: "power3.in" }, t0 + B * 2);
        tl.to(QA(id, ".dd"), { opacity: 0, duration: 0.15 }, t0 + B * 3.3);
        const g0 = t0 + BAR;
        tl.fromTo(Q(id, ".sun"), { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 50, duration: d - BAR, ease: "none" }, g0);
        pop(Q(id, ".badge"), g0, { ease: "elastic.out(1, 0.5)", d: 0.9, r0: -40 });
        burst(g0 + 0.1, W / 2, H * 0.42, 30);
        const nm = Q(id, ".name");
        typeFit(nm, g0 + B, BAR * 0.9);
        const ws = QA(id, ".word");
        ws.forEach((w, i) => pop(w, t0 + BAR * 1.75 + i * B * Math.min(1, 2 / ws.length), { y0: 40, d: 0.4 }));
        pop(Q(id, ".pill"), t0 + d - BAR * 0.6, { y0: 30 });
        breathe(Q(id, ".badge-in"), g0 + 1, t0 + d);
      };
      S.kinetic = (id, t0, d) => {
        const big = Q(id, ".big");
        const dur = typeFit(big, t0, BAR * 1.1);
        const mk = Q(id, ".mark");

        const tg = Q(id, ".tagline");
        if (tg) typeFit(tg, t0 + BAR * 2, BAR * 0.8, B / 3);
        breathe(Q(id, ".emblem"), t0 + BAR * 1.5, t0 + d, 0.03);
      };

      // ---------- 依幕表建立整條時間軸 ----------
      gsap.set("#rays", { width: 2 * R, height: 2 * R, left: W / 2 - R, top: H / 2 - R });
      tl.fromTo("#rays", { rotation: 0 }, { rotation: 36, duration: BEAT.dur, ease: "none" }, 0);
      const FX = { rays: "#rays", vig: "#vig", paper: "#paper", dust: "#dust" };
      setBg(0, BEAT.scenes[0].bg);
      BEAT.scenes.forEach((s, i) => {
        Object.entries(FX).forEach(([k, sel]) => tl.set(sel, { opacity: (s.fx || []).includes(k) ? 1 : 0 }, s.t0));
        if (i > 0) {
          transition(s.tr, s.t0, s.bg, BEAT.stripes);
          setBg(s.t0, s.bg);
          if (s.tr === "cut") {
            const prev = BEAT.scenes[i - 1];
            tl.to("#" + prev.id + " .stage", { opacity: 0, scale: 0.94, duration: 0.16, ease: "power2.in" }, s.t0 - 0.16);
          }
        }
        CUR_END = s.t0 + s.d;
        S[s.type](s.id, s.t0, s.d);
      });
      {{CALLS}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
